project:
  name: virtual-storage-raid-lab
  version: "1.0"

host:
  os: debian13
  qemu_binary: qemu-system-x86_64
  qemu_img: qemu-img
  qemu_nbd: qemu-nbd

image:
  name: disk_proto
  format: qcow2
  size_gb: 10

raid:
  level: 1
  device: /dev/md0
  metadata: "1.2"

vm:
  name: raidlab
  cpus: 2
  memory_mb: 4096

ssh:
  user: root
  password: root
  port: 2222
  timeout_seconds: 300

serial:
  port: ttyS0
  timeout_seconds: 300

ansible:
  inventory: ansible/inventory.ini
  playbook: ansible/site.yml

artifacts:
  directory: artifacts

logging:
  level: info

coverage:
  directory: coverage